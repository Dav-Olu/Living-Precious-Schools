<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Online Admissions Form</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 30px 15px;
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f6f8;
      color: #222;
    }

    .form-container {
      max-width: 850px;
      margin: auto;
      background: #fff;
      padding: 40px;
      border-radius: 10px;
      box-shadow: 0 3px 15px rgba(0,0,0,0.08);
    }

    .header {
      text-align: center;
      margin-bottom: 35px;
    }

    .header h1 {
      margin: 0 0 8px;
      font-size: 30px;
      color: #163b65;
    }

    .header p {
      margin: 0;
      color: #666;
    }

    .section {
      margin-top: 35px;
    }

    .section h2 {
      background: #163b65;
      color: white;
      padding: 13px 16px;
      border-radius: 5px;
      font-size: 19px;
      margin-bottom: 22px;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 18px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
    }

    .form-group.full {
      grid-column: 1 / -1;
    }

    label {
      font-weight: bold;
      margin-bottom: 7px;
      font-size: 14px;
    }

    label span {
      color: #d00;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-size: 15px;
      font-family: inherit;
    }

    textarea {
      min-height: 80px;
      resize: vertical;
    }

    input:focus,
    select:focus,
    textarea:focus {
      outline: none;
      border-color: #163b65;
      box-shadow: 0 0 0 2px rgba(22,59,101,0.1);
    }

    .buttons {
      text-align: center;
      margin-top: 35px;
    }

    button {
      border: none;
      padding: 13px 25px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 15px;
      font-weight: bold;
      margin: 5px;
    }

    .submit-btn {
      background: #163b65;
      color: white;
    }

    .print-btn {
      background: #198754;
      color: white;
    }

    .reset-btn {
      background: #6c757d;
      color: white;
    }

    .required-note {
      font-size: 13px;
      color: #777;
      margin-top: 20px;
    }

    @media (max-width: 650px) {
      .form-container {
        padding: 25px 18px;
      }

      .form-row {
        grid-template-columns: 1fr;
      }

      .form-group.full {
        grid-column: auto;
      }
    }

    @media print {
      body {
        background: white;
        padding: 0;
      }

      .form-container {
        box-shadow: none;
        max-width: 100%;
        padding: 10px;
      }

      .buttons {
        display: none;
      }

      input,
      select,
      textarea {
        border: 1px solid #999;
      }
    }
  </style>
</head>

<body>

<div class="form-container">

  <div class="header">
    <h1>Online Admissions Form</h1>
    <p>Please complete all required fields marked with *</p>
  </div>

  <form id="admissionForm">

    <!-- PARENT / GUARDIAN DETAILS -->
    <div class="section">
      <h2>Parent / Guardian Details</h2>

      <div class="form-row">

        <div class="form-group">
          <label for="name">Name <span>*</span></label>
          <input type="text" id="name" name="name" required>
        </div>

        <div class="form-group">
          <label for="email">Your Email <span>*</span></label>
          <input type="email" id="email" name="email" required>
        </div>

        <div class="form-group">
          <label for="phone">Phone Number <span>*</span></label>
          <input type="tel" id="phone" name="phone" required>
        </div>

        <div class="form-group">
          <label for="relationship">Relationship to Child <span>*</span></label>
          <select id="relationship" name="relationship" required>
            <option value="">Select relationship</option>
            <option value="Parent">Parent</option>
            <option value="Guardian">Guardian</option>
            <option value="Father">Father</option>
            <option value="Mother">Mother</option>
            <option value="Other">Other</option>
          </select>
        </div>

      </div>
    </div>


    <!-- PROSPECTIVE STUDENT -->
    <div class="section">
      <h2>Prospective Student's Details</h2>

      <div class="form-row">

        <div class="form-group">
          <label for="familyName">Family Name <span>*</span></label>
          <input type="text" id="familyName" name="familyName" required>
        </div>

        <div class="form-group">
          <label for="firstName">Child's First Name <span>*</span></label>
          <input type="text" id="firstName" name="firstName" required>
        </div>

        <div class="form-group">
          <label for="dob">Date of Birth <span>*</span></label>
          <input type="date" id="dob" name="dob" required>
        </div>

        <div class="form-group">
          <label for="studentGender">Gender <span>*</span></label>
          <select id="studentGender" name="studentGender" required>
            <option value="">Select gender</option>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
          </select>
        </div>

        <div class="form-group">
          <label for="nationality">Nationality <span>*</span></label>
          <input type="text" id="nationality" name="nationality" required>
        </div>

        <div class="form-group">
          <label for="entryYear">Proposed Year of Entry <span>*</span></label>
          <select id="entryYear" name="entryYear" required>
            <option value="">Select year</option>
            <option value="2026">2026</option>
            <option value="2027">2027</option>
            <option value="2028">2028</option>
            <option value="2029">2029</option>
            <option value="2030">2030</option>
          </select>
        </div>

      </div>
    </div>


    <!-- PRESENT SCHOOL -->
    <div class="section">
      <h2>Present School</h2>

      <div class="form-row">

        <div class="form-group full">
          <label for="schoolName">School Name <span>*</span></label>
          <input type="text" id="schoolName" name="schoolName" required>
        </div>

        <div class="form-group full">
          <label for="schoolAddress">Address <span>*</span></label>
          <textarea id="schoolAddress" name="schoolAddress" required></textarea>
        </div>

        <div class="form-group">
          <label for="currentClass">Current Class <span>*</span></label>
          <input type="text" id="currentClass" name="currentClass" required>
        </div>

        <div class="form-group">
          <label for="schoolGender">Gender <span>*</span></label>
          <select id="schoolGender" name="schoolGender" required>
            <option value="">Select gender</option>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
            <option value="Mixed">Mixed</option>
          </select>
        </div>

        <div class="form-group full">
          <label for="schoolEmail">Email <span>*</span></label>
          <input type="email" id="schoolEmail" name="schoolEmail" required>
        </div>

      </div>
    </div>

    <p class="required-note">
      * Required fields
    </p>

    <div class="buttons">
      <button type="submit" class="submit-btn">
        Submit Application
      </button>

      <button type="button" class="print-btn" onclick="window.print()">
        Download / Save as PDF
      </button>

      <button type="reset" class="reset-btn">
        Clear Form
      </button>
    </div>

  </form>

</div>

<script>
  document.getElementById("admissionForm").addEventListener("submit", function(event) {
    event.preventDefault();

    alert(
      "Your admission form has been completed. " +
      "To save a copy, click 'Download / Save as PDF'."
    );
  });
</script>

</body>
</html>
